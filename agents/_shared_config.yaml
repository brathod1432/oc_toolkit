# Polsia — Shared Agent Defaults
# All agent YAML frontmatter inherits these values unless overridden.

# LLM
model: meta/llama-3.1-70b-instruct
model_provider: nvidia
base_url: https://integrate.api.nvidia.com/v1
max_tokens: 4096
temperature: 0.2
timeout_secs: 120

# Execution
max_retries: 2
retry_backoff_secs: 5
sandbox_safe: true          # override to false for agents that make real API calls
enabled: true

# Logging
log_level: INFO
log_inputs: true            # log task dict on entry
log_outputs: true           # log result dict on exit
log_llm_calls: false        # set true during debugging (verbose)

# Output contract — every agent MUST return these keys
required_output_keys:
  - summary                 # str: one-sentence human-readable result
  - status                  # str: "success" | "failed" | "skipped"
  - handoff                 # the === HANDOFF === block every worker ends with (see handoff_fields)

# Structured handoff — every worker ends its output with this block so the next
# agent (and the validator) inherits what happened instead of relying on memory.
handoff_fields:
  - completed               # what was actually finished
  - not_done                # in-scope work left unfinished, and why
  - commands_run            # every command with its exit code
  - files_changed           # every file created or modified
  - issues_found            # problems discovered, including out-of-scope ones
  - assertions              # per validation-contract assertion: MET / NOT MET / UNSURE + evidence
  - procedure               # FOLLOWED, or every deviation and why

# Optional output keys used by specific agents
optional_output_keys:
  - files_written           # list[str]: code_generation
  - test_result             # dict:      code_generation
  - pr_url                  # str:       code_generation
  - deployed                # bool:      deployment
  - deploy_url              # str:       deployment
  - posts_created           # list:      social_media
  - emails_sent             # int:       email_outreach
  - report                  # dict:      finance, competitor_research
  - plan                    # dict:      business_planning
  - assertion_results       # dict:      grounded_review, user_testing_validator (A1: PASS | FAIL | ...)

# Celery task routing
celery_queue: agents
task_acks_late: true
task_reject_on_worker_lost: true

# SANDBOX guard — when SANDBOX_MODE=true, agents must NOT:
#   - make real HTTP calls to external APIs
#   - write to production databases
#   - send real emails, tweets, or ad spend
#   - push code to GitHub
# They MUST return a result with summary beginning "[SANDBOX]"
